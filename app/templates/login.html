{% extends "base.html" %}
{% block title %}Log in · CashBridge{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>Log in</h1>
  <p class="muted small">Only the business owner can approve loans or see business data.</p>
  <form method="post" action="/login">
    <label>Username <input type="text" name="username" autocomplete="username" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <p><button class="primary">Log in</button></p>
  </form>
  {% if demo %}<p class="muted small">Demo account: <code>demo</code> / password from <code>DEMO_PASSWORD</code> (default <code>cashbridge-demo</code>).</p>{% endif %}
</div>
{% endblock %}
